[project]
name = "wissen"
dynamic = ["version"]
description = "Folder-based archive for documentation and manuals: Markdown pages and PDFs side by side"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "anthropic>=2.6",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
wissen = "wissen.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wissen = ["static/**/*", "VERSION"]

[tool.pytest.ini_options]
testpaths = ["tests"]
